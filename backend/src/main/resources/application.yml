spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/attendance_db
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-that-is-at-least-256-bits-long-for-HS256-algorithm}
    expiration-ms: 86400000

server:
  port: 8080
