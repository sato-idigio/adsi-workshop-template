spring:
  datasource:
    url: jdbc:h2:mem:workshopdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: workshop-secret-key-that-is-at-least-256-bits-long-for-HS256-algorithm
    expiration-ms: 86400000
